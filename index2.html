<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Dashboard</title>
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!--External stylesheet-->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Kris Fulk for the WEB-115 course at Wake Tech.</p>
    <script>document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");</script>
    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>

    <!-- Weekly Task Goal -->
    <div class="container">
        <div class="row">
            <div class="col" id="weekly-tasks">
                <script src="js/task-manager.js" defer></script>
                <form id="goal-form">
                    <div class="userName">
                        <label for="userName">Name:</label>
                        <input type="text" id="userName" name="userName" required>
                    </div>
                    <div class="dailyGoal">
                        <label for="dailyGoal">Enter your daily task goal:</label>
                        <input type="number" id="dailyGoal" name="dailyGoal" required>
                    </div>
                    <div class="bonusTasks">
                        <label for="bonusTasks">Weekly bonus tasks:</label>
                        <input type="number" id="bonusTasks" name="bonusTasks" required>
                    </div>
                    <button type="submit" id="goal-btn">Submit</button>
                </form>
                <p id="goal-message"></p>
            </div>
        </div>

        <!-- Metric Converter -->
        <div class="col" id="metric-converter">
            <script src="js/metric-converter.js" defer></script>
            <form id="converter-form">
                <div class="convertValue">
                    <label for="convertValue">Enter a value:</label>
                    <input type="number" id="convertValue" name="convertValue" step="any" required>
                </div>
                <div class="conversionType">
                    <label for="conversionType">Choose a conversion:</label>
                    <select id="conversionType" name="conversionType">
                        <optgroup label="Imperial to Metric">
                            <option value="inch to centimeter">Inches to centimeters</option>
                            <option value="foot to centimeter">Feet to centimeters</option>
                            <option value="yard to meter">Yards to meters</option>
                            <option value="mile to kilometer">Miles to kilometers</option>
                        </optgroup>
                        <optgroup label="Metric to Imperial">
                            <option value="centimeter to inch">Centimeters to inches</option>
                            <option value="centimeter to foot">Centimeters to feet</option>
                            <option value="meter to yard">Meters to yards</option>
                            <option value="kilometer to mile">Kilometers to miles</option>
                        </optgroup>
                    </select>
                </div>
                <button type="submit" id="convert-btn">Convert</button>
            </form>
            <p id="convert-result"></p>
        </div>
    </div>
</body>

</html>
